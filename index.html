<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Полный курс C · Типовник МЭИ</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #E95420; --purple: #77216F; --dark: #2C001E;
  --bg: #F2F1EF; --card: #FFFFFF; --text: #2C001E; --muted: #5E2750;
  --border: #DCD9D5; --pre-bg: #300A24; --pre-text: #E8DEE6;
  --success: #0E8420; --danger: #C7162B; --shadow: 0 4px 12px rgba(44,0,30,.1);
}
[data-theme="dark"] {
  --bg: #1E1E1E; --card: #2D2D2D; --text: #F2F1EF; --muted: #A0A0A0;
  --border: #3D3D3D; --dark: #121212; --pre-bg: #111; --pre-text: #D4D4D4;
  --shadow: 0 4px 12px rgba(0,0,0,.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; transition: 0.2s; }
body { font-family: 'Ubuntu', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--orange); text-decoration: none; }

/* AUTH */
#auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #2C001E, #77216F); padding: 24px; }
.auth-card { background: var(--card); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow); }
.auth-card h1 { margin-bottom: 20px; text-align: center; font-weight: 500; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--muted); }
.field input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
.field input:focus { outline: none; border-color: var(--orange); }
.btn-auth { width: 100%; padding: 14px; background: var(--orange); color: #fff; border-radius: 8px; font-size: 1rem; font-weight: 500; margin-top: 10px; }
.auth-toggle { text-align: center; margin-top: 20px; font-size: 0.9rem; }
.auth-msg { padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; margin-bottom: 15px; }
.auth-msg.error { background: #FFE5E8; color: #8B0A19; display: block; }

/* APP */
#app-screen { display: none; }
#app-screen.show { display: flex; }
.sidebar { width: 320px; background: var(--dark); color: #F2F1EF; position: fixed; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; justify-content: space-between; align-items: center; }
.theme-btn { font-size: 1.2rem; }
.user-card { padding: 15px 20px; background: rgba(0,0,0,.2); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
.logout-btn { background: rgba(233,84,32,.2); color: var(--orange); padding: 5px 10px; border-radius: 4px; }
.progress-wrap { padding: 15px 20px; background: rgba(0,0,0,.1); font-size: 0.8rem; }
.progress-bar { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--orange); width: 0%; }
.nav-list { list-style: none; padding: 10px 0; flex: 1; }
.nav-module { padding: 15px 20px 5px; font-size: 0.75rem; font-weight: 700; color: #8B6A85; text-transform: uppercase; }
.nav-item a { display: block; padding: 10px 20px; color: #C9B8C4; font-size: 0.9rem; border-left: 3px solid transparent; }
.nav-item a:hover, .nav-item a.active { background: rgba(233,84,32,.1); color: #fff; border-left-color: var(--orange); }
.nav-item a.completed::after { content: '✓'; float: right; color: var(--orange); }

/* MAIN */
.main-content { margin-left: 320px; padding: 40px; flex: 1; max-width: 1000px; }
h1 { margin-bottom: 20px; font-weight: 500; border-left: 4px solid var(--orange); padding-left: 15px; }
.theory { background: var(--card); padding: 24px; border-radius: 8px; margin-bottom: 24px; box-shadow: var(--shadow); }
pre { background: var(--pre-bg); color: var(--pre-text); padding: 16px; border-radius: 8px; overflow-x: auto; font-family: 'Ubuntu Mono', monospace; margin: 10px 0; }
code { font-family: 'Ubuntu Mono', monospace; background: var(--border); padding: 2px 6px; border-radius: 4px; }
pre code { background: transparent; padding: 0; }
.task { background: var(--card); padding: 24px; border-radius: 8px; margin-bottom: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.task-title { font-weight: 500; font-size: 1.1rem; margin-bottom: 10px; color: var(--orange); }
.task-desc { margin-bottom: 15px; font-size: 0.95rem; }
textarea { width: 100%; height: 200px; padding: 15px; background: var(--pre-bg); color: var(--pre-text); border: 1px solid var(--border); border-radius: 8px; font-family: 'Ubuntu Mono', monospace; resize: vertical; }
textarea:focus { outline: none; border-color: var(--orange); }
.btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
.btn { padding: 10px 20px; border-radius: 8px; font-weight: 500; }
.btn-primary { background: var(--orange); color: #fff; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-success { background: var(--success); color: #fff; }
.result { margin-top: 15px; padding: 15px; border-radius: 8px; font-family: 'Ubuntu Mono', monospace; font-size: 0.9rem; white-space: pre-wrap; display: none; }
.result.show { display: block; }
.result.success { background: rgba(14,132,32,.15); border-left: 4px solid var(--success); color: var(--success); }
.result.error { background: rgba(199,22,43,.15); border-left: 4px solid var(--danger); color: var(--danger); }
.solution { display: none; margin-top: 15px; }
.solution.show { display: block; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <h1 id="auth-title">Вход</h1>
    <div id="auth-error" class="auth-msg error"></div>
    <form id="auth-form">
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <div class="field"><label>Пароль</label><input type="password" id="password" required minlength="6"></div>
      <button type="submit" class="btn-auth" id="auth-submit">Войти</button>
    </form>
    <div class="auth-toggle"><span id="toggle-text">Нет аккаунта?</span> <a href="#" id="toggle-auth">Зарегистрироваться</a></div>
  </div>
</div>

<div id="app-screen">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>Курс C</h2><button class="theme-btn" id="theme-toggle">🌙</button></div>
    <div class="user-card"><span id="user-email">...</span><button class="logout-btn" onclick="logout()">Выйти</button></div>
    <div class="progress-wrap"><span>Прогресс: <b id="progress-percent">0%</b></span><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div></div>
    <ul class="nav-list" id="nav-list"></ul>
  </aside>
  <main class="main-content" id="main-content"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoNhWX_8vGWaQl9rgFeq2Ni-YXpjMbI5Q",
  authDomain: "mpei-aad98.firebaseapp.com",
  projectId: "mpei-aad98",
  storageBucket: "mpei-aad98.firebasestorage.app",
  messagingSenderId: "1012888887163",
  appId: "1:1012888887163:web:a9fc5cc1f928277bf327de"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// === ТЕМА ===
const themeBtn = document.getElementById('theme-toggle');
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
themeBtn.textContent = localStorage.getItem('theme') === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const nt = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nt);
  localStorage.setItem('theme', nt);
  themeBtn.textContent = nt === 'dark' ? '☀️' : '🌙';
});

// === API C ===
async function runC(code) {
  try {
    const res = await fetch("https://emkc.org/api/v2/piston/execute", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: "c", version: "10.2.0", files: [{ content: code }] })
    });
    const data = await res.json();
    if (data.run.stderr) return { success: false, msg: data.run.stderr };
    return { success: true, out: data.run.stdout.trim() };
  } catch (e) { return { success: false, msg: e.message }; }
}
async function cExact(code, exp) {
  const r = await runC(code); if (!r.success) return { success: false, message: r.msg };
  return { success: r.out === exp, message: r.out === exp ? "Верно!" : `Ожидалось: ${exp}\nПолучено: ${r.out}` };
}
async function cNum(code, exp, eps) {
  const r = await runC(code); if (!r.success) return { success: false, message: r.msg };
  const n = parseFloat(r.out); const ok = Math.abs(n - exp) < eps;
  return { success: ok, message: ok ? "Верно!" : `Ожидалось ≈${exp}, получено ${n}` };
}

// ==========================================
// ВСТАВЬ СЮДА ЧАСТИ 2, 3 И 4 (МАССИВ КУРСА)
// ==========================================
const courseData = { modules: { id:'ch1', title:'Глава 1. Простые задачи', lessons:[
  { id:'1.1', title:'1.1. Формулы', theory:`<p>Подключите <code>&lt;math.h&gt;</code> для формул.</p>`, tasks:[
    {id:'t1_1', title:'Формула 1', desc:'f(x)=√(e^(2.3x))−sin(πx/(x+2/3))+1.7 при x=0.5. Ответ ≈2.45833.', init:'#include <stdio.h>\n#include <math.h>\nint main(){\n double x=0.5;\n // код\n return 0;\n}', sol:'#include <stdio.h>\n#include <math.h>\nint main(){\n double x=0.5;\n printf("%.5f\\n", sqrt(exp(2.3*x))-sin(M_PI*x/(x+2.0/3.0))+1.7);\n return 0;\n}', check:c=>cNum(c,2.45833,0.01)},
    {id:'t1_2', title:'Формула 2', desc:'f(x)=√x·sin(x²/2)−1.3 при x=0.5. Ответ ≈−0.19452.', init:'#include <stdio.h>\n#include <math.h>\nint main(){\n double x=0.5;\n // код\n return 0;\n}', sol:'#include <stdio.h>\n#include <math.h>\nint main(){\n double x=0.5;\n printf("%.5f\\n", sqrt(x)*sin(x*x/2)-1.3);\n return 0;\n}', check:c=>cNum(c,-0.19452,0.01)}
  ]},
  { id:'1.4', title:'1.4. Накопление сумм', theory:`<p>Сумма через цикл.</p>`, tasks:[
    {id:'t1_3', title:'Сумма 1..N', desc:'Сумма от 1 до 100. Ответ 5050.', init:'#include <stdio.h>\nint main(){\n int s=0;\n // код\n printf("%d\\n",s);\n return 0;\n}', sol:'#include <stdio.h>\nint main(){\n int s=0;\n for(int i=1;i<=100;i++) s+=i;\n printf("%d\\n",s);\n return 0;\n}', check:c=>cExact(c,'5050')}
  ]},
  { id:'1.5', title:'1.5. Суммы и произведения', theory:`<p>Накопление произведения.</p>`, tasks:[
    {id:'t1_4', title:'Факториал', desc:'5! = 120', init:'#include <stdio.h>\nint main(){\n int p=1;\n // код\n printf("%d\\n",p);\n return 0;\n}', sol:'#include <stdio.h>\nint main(){\n int p=1;\n for(int i=1;i<=5;i++) p*=i;\n printf("%d\\n",p);\n return 0;\n}', check:c=>cExact(c,'120')}
  ]}
]},
{ id:'ch2', title:'Глава 2. 1D Массивы', lessons:[
  { id:'2.2', title:'2.2. Ветвление в цикле ⭐', theory:`<p>Условие внутри цикла.</p>`, tasks:[
    {id:'t2_1', title:'Сумма чётных', desc:'{1,2,3,4,5,6} → 12.', init:'#include <stdio.h>\nint main(){\n int a[]={1,2,3,4,5,6}, s=0;\n // код\n printf("%d\\n",s);\n return 0;\n}', sol:'#include <stdio.h>\nint main(){\n int a[]={1,2,3,4,5,6}, s=0;\n for(int i=0;i<6;i++) if(a[i]%2==0) s+=a[i];\n printf("%d\\n",s);\n return 0;\n}', check:c=>cExact(c,'12')}
  ]},
  { id:'2.3', title:'2.3. Экстремумы', theory:`<p>Поиск максимума.</p>`, tasks:[
    {id:'t2_2', title:'Максимум', desc:'{3,7,2,9,5} → 9.', init:'#include <stdio.h>\nint main(){\n int a[]={3,7,2,9,5}, m=a[0];\n // код\n printf("%d\\n",m);\n return 0;\n}', sol:'#include <stdio.h>\nint main(){\n int a[]={3,7,2,9,5}, m=a[0];\n for(int i=1;i<5;i++) if(a[i]>m) m=a[i];\n printf("%d\\n",m);\n return 0;\n}', check:c=>cExact(c,'9')}
  ]},
  { id:'2.4', title:'2.4. Поиск по условию ⭐', theory:`<p>Без break! Используем флаги.</p>`, tasks:[
    {id:'t2_3', title:'Первый отрицательный', desc:'{5,3,-2,7,-1} → индекс 2.', init:'#include <stdio.h>\nint main(){\n int a[]={5,3,-2,7,-1}, idx=-1;\n // код (без break)\n printf("%d\\n",idx);\n return 0;\n}', sol:'#include <stdio.h>\nint main(){\n int a[]={5,3,-2,7,-1}, idx=-1;\n for(int i=0;i<5;i++) if(a[i]<0 && idx==-1) idx=i;\n printf("%d\\n",idx);\n return 0;\n}', check:c=>cExact(c,'2')}
  ]}
]},
{ id:'ch3', title:'Глава 3. 2D Массивы', lessons:[
  { id:'3.1', title:'3.1. Обработка матриц', theory:`<p>Двумерные массивы в C.</p>`, tasks:[
    {id:'t3_1', title:'Сумма элементов', desc:'Матрица 2x2 {{1,2},{3,4}}. Сумма = 10.', init:'#include <stdio.h>\nint main(){\n int m[2][2]={{1,2},{3,4}}, s=0;\n // код\n printf("%d\\n",s);\n return 0;\n}', sol:'#include <stdio.h>\nint main(){\n int m[2][2]={{1,2},{3,4}}, s=0;\n for(int i=0;i<2;i++) for(int j=0;j<2;j++) s+=m[i][j];\n printf("%d\\n",s);\n return 0;\n}', check:c=>cExact(c,'10')}
  ]},
  { id:'3.4', title:'3.4. Строки и столбцы', theory:`<p>Поиск по строкам.</p>`, tasks:[
    {id:'t3_2', title:'Главная диагональ', desc:'Сумма элементов главной диагонали матрицы 3x3 {{1,2,3},{4,5,6},{7,8,9}}. Ответ 15.', init:'#include <stdio.h>\nint main(){\n int m[3][3]={{1,2,3},{4,5,6},{7,8,9}}, s=0;\n // код\n printf("%d\\n",s);\n return 0;\n}', sol:'#include <stdio.h>\nint main(){\n int m[3][3]={{1,2,3},{4,5,6},{7,8,9}}, s=0;\n for(int i=0;i<3;i++) s+=m[i][i];\n printf("%d\\n",s);\n return 0;\n}', check:c=>cExact(c,'15')}
  ]}
]}, }; 
// (Скопируй содержимое modules из следующих частей сюда)

// === ЛОГИКА ===
let state = { user: null, id: null, comp: {}, code: {}, reg: false, loading: false };
const $ = id => document.getElementById(id);

async function save() {
  if (!state.user || state.loading) return;
  try { await setDoc(doc(db, 'users', state.user.uid), { email: state.user.email, completed: state.comp, code: state.code, updatedAt: serverTimestamp() }, { merge: true }); } catch(e) {}
}
async function load() {
  if (!state.user) return; state.loading = true;
  try {
    const snap = await getDoc(doc(db, 'users', state.user.uid));
    if (snap.exists()) { state.comp = snap.data().completed || {}; state.code = snap.data().code || {}; }
  } catch(e) {} state.loading = false;
}

function updateAuthUI() {
  $('auth-title').textContent = state.reg ? 'Регистрация' : 'Вход';
  $('auth-submit').textContent = state.reg ? 'Зарегистрироваться' : 'Войти';
  $('toggle-text').textContent = state.reg ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
  $('toggle-auth').textContent = state.reg ? 'Войти' : 'Зарегистрироваться';
}

$('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value, pass = $('password').value;
  $('auth-submit').disabled = true;
  try {
    if (state.reg) await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
  } catch(err) {
    $('auth-error').textContent = err.message; $('auth-error').style.display = 'block';
    $('auth-submit').disabled = false;
  }
});
$('toggle-auth').addEventListener('click', e => { e.preventDefault(); state.reg = !state.reg; updateAuthUI(); });

onAuthStateChanged(auth, async u => {
  if (u) {
    state.user = u; $('user-email').textContent = u.email; await load();
    $('auth-screen').style.display = 'none'; $('app-screen').classList.add('show');
    render();
  } else {
    state.user = null; state.comp = {}; state.code = {};
    $('auth-screen').style.display = 'flex'; $('app-screen').classList.remove('show');
  }
});
async function logout() { if(confirm('Выйти?')) await signOut(auth); }

function render() {
  const nav = $('nav-list'); nav.innerHTML = '';
  courseData.modules.forEach(m => {
    nav.innerHTML += `<div class="nav-module">${m.title}</div>`;
    m.lessons.forEach(l => {
      const a = document.createElement('a'); a.href = '#'; a.textContent = l.title;
      if (state.id === l.id) a.classList.add('active');
      if (state.comp[l.id]) a.classList.add('completed');
      a.onclick = e => { e.preventDefault(); loadLesson(l.id); };
      const li = document.createElement('li'); li.className = 'nav-item'; li.appendChild(a); nav.appendChild(li);
    });
  });
  let t = 0, d = 0; courseData.modules.forEach(m => m.lessons.forEach(l => { t++; if (state.comp[l.id]) d++; }));
  $('progress-percent').textContent = (t ? Math.round(d/t*100) : 0) + '%';
  $('progress-fill').style.width = (t ? Math.round(d/t*100) : 0) + '%';
}

function loadLesson(id) {
  state.id = id; render();
  let found;
  courseData.modules.forEach(m => m.lessons.forEach(l => { if (l.id === id) found = l; }));
  if (!found) return;
  
  let html = `<h1>${found.title}</h1><div class="theory">${found.theory}</div>`;
  found.tasks.forEach(t => {
    const saved = state.code[t.id] !== undefined ? state.code[t.id] : t.init;
    html += `<div class="task">
      <div class="task-title">${t.title}</div>
      <div class="task-desc">${t.desc}</div>
      <textarea id="code-${t.id}" spellcheck="false">${saved}</textarea>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="check('${t.id}')">▶ Проверить (C)</button>
        <button class="btn btn-secondary" onclick="sol('${t.id}')">Решение</button>
        <button class="btn btn-success" onclick="done('${found.id}')">✓ Пройдено</button>
      </div>
      <div class="result" id="res-${t.id}"></div>
      <div class="solution" id="sol-${t.id}"><pre><code>${t.sol.replace(/</g,'&lt;')}</code></pre></div>
    </div>`;
  });
  $('main-content').innerHTML = html;
  found.tasks.forEach(t => {
    $('code-'+t.id).addEventListener('input', e => { state.code[t.id] = e.target.value; setTimeout(save, 1500); });
  });
}

async function check(id) {
  let found, task;
  courseData.modules.forEach(m => m.lessons.forEach(l => {
    if (l.id === state.id) { found = l; task = l.tasks.find(x => x.id === id); }
  }));
  const code = $('code-'+id).value; state.code[id] = code;
  const res = $('res-'+id); res.className = 'result show'; res.textContent = '⏳ Компиляция...';
  const r = await task.check(code);
  if (r.success) { res.className = 'result show success'; res.textContent = '✅ ' + r.message; done(found.id, true); }
  else { res.className = 'result show error'; res.textContent = '❌ ' + r.message; }
  save();
}
function sol(id) { $('sol-'+id).classList.toggle('show'); }
function done(id, silent) { state.comp[id] = true; render(); save(); }
window.check = check; window.sol = sol; window.done = done; window.logout = logout;
</script>
</body>
</html>
