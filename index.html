<style>
:root {
  /* Светлая тема (Ubuntu Yaru Light) */
  --orange: #E95420;
  --orange-hover: #C7401E;
  --purple: #77216F;
  --dark: #2C001E;
  --bg: #F2F1EF;
  --card-bg: #FFFFFF;
  --text: #2C001E;
  --muted: #5E2750;
  --border: #DCD9D5;
  --pre-bg: #300A24;
  --pre-text: #E8DEE6;
  --success: #0E8420;
  --danger: #C7162B;
  --shadow-sm: 0 1px 3px rgba(44,0,30,.08);
  --shadow-md: 0 4px 12px rgba(44,0,30,.1);
  --shadow-lg: 0 12px 32px rgba(44,0,30,.18);
  --radius: 8px;
}
[data-theme="dark"] {
  /* Темная тема (Ubuntu Yaru Dark) */
  --bg: #1E1E1E;
  --card-bg: #2D2D2D;
  --text: #F2F1EF;
  --muted: #A0A0A0;
  --border: #3D3D3D;
  --dark: #121212;
  --pre-bg: #111111;
  --pre-text: #D4D4D4;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
  --shadow-md: 0 4px 12px rgba(0,0,0,.5);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.7);
}
* { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
body { font-family: 'Ubuntu', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--orange); text-decoration: none; }

/* AUTH */
#auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at 20% 20%, rgba(233,84,32,.25) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(119,33,111,.35) 0%, transparent 45%), linear-gradient(135deg, #2C001E 0%, #4A0E3C 50%, #77216F 100%); padding: 24px; }
.auth-card { background: var(--card-bg); border-radius: 16px; padding: 40px 36px; box-shadow: var(--shadow-lg); width: 100%; max-width: 420px; animation: fadeUp .6s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.auth-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
.auth-logo svg { width: 72px; height: 72px; filter: drop-shadow(0 4px 12px rgba(233,84,32,.35)); }
.auth-logo h1 { font-size: 1.65rem; font-weight: 500; margin-top: 16px; color: var(--text); }
.auth-logo p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.auth-form { display: flex; flex-direction: column; gap: 16px; }
.field label { font-size: .82rem; font-weight: 500; color: var(--muted); text-transform: uppercase; }
.field input { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 1rem; background: var(--bg); color: var(--text); }
.field input:focus { outline: none; border-color: var(--orange); }
.btn-auth { padding: 13px; background: linear-gradient(135deg, var(--orange) 0%, #F27C3E 100%); color: #fff; border-radius: var(--radius); font-size: 1rem; font-weight: 500; margin-top: 8px; }
.btn-auth:disabled { opacity: .65; }
.auth-toggle { text-align: center; margin-top: 20px; font-size: .88rem; color: var(--muted); }
.auth-msg { padding: 10px 14px; border-radius: var(--radius); font-size: .88rem; display: none; }
.auth-msg.show { display: block; }
.auth-msg.error { background: #FFE5E8; color: #8B0A19; border-left: 3px solid var(--danger); }
.auth-msg.success { background: #E8F6EA; color: #0A5C16; border-left: 3px solid var(--success); }

/* APP */
#app-screen { display: none; min-height: 100vh; }
#app-screen.show { display: flex; }
.sidebar { width: 300px; flex-shrink: 0; background: var(--dark); color: #F2F1EF; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; border-right: 1px solid rgba(255,255,255,.06); z-index: 100; }
.sidebar-header { padding: 20px 22px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; align-items: center; }
.sidebar-header h2 { font-size: 1rem; font-weight: 500; color: #fff; }
.theme-btn { background: rgba(255,255,255,.1); padding: 6px 10px; border-radius: 6px; font-size: 1.2rem; }
.user-card { padding: 14px 20px; background: rgba(0,0,0,.2); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,.06); }
.user-card .email { font-size: .82rem; color: #B6A0B0; overflow: hidden; text-overflow: ellipsis; }
.logout-btn { padding: 6px 12px; background: rgba(233,84,32,.15); color: #F27C3E; border-radius: 4px; font-size: .75rem; }
.progress-wrap { padding: 16px 22px; background: rgba(0,0,0,.15); }
.progress-label { display: flex; justify-content: space-between; font-size: .78rem; color: #B6A0B0; margin-bottom: 8px; }
.progress-bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--orange); width: 0%; transition: width .5s; }
.nav-list { list-style: none; padding: 12px 0; flex: 1; }
.nav-module-title { padding: 14px 22px 6px; font-size: .7rem; font-weight: 700; color: #8B6A85; text-transform: uppercase; }
.nav-item a { display: flex; align-items: center; padding: 10px 22px; color: #C9B8C4; font-size: .9rem; border-left: 3px solid transparent; }
.nav-item a:hover, .nav-item a.active { background: rgba(233,84,32,.14); color: #fff; border-left-color: var(--orange); }
.nav-item a.completed::after { content: '✓'; margin-left: auto; color: var(--orange); }
.admin-link { background: rgba(233,84,32,.18); color: #F27C3E; margin: 8px 12px; border-radius: 6px; padding: 12px; text-align: center; display: block; font-weight: 500; }

/* MAIN CONTENT */
.main-content { margin-left: 300px; flex: 1; padding: 40px 48px; max-width: 1000px; width: 100%; min-height: 100vh; }
h1 { font-size: 1.9rem; font-weight: 500; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
h1::before { content: ''; display: inline-block; width: 4px; height: 32px; background: var(--orange); border-radius: 2px; }
h2 { font-size: 1.3rem; font-weight: 500; color: var(--purple); margin: 24px 0 14px; }
[data-theme="dark"] h2 { color: #D18ECC; }
.theory { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin: 16px 0 24px; box-shadow: var(--shadow-sm); border-left: 4px solid var(--orange); }
pre { background: var(--pre-bg); color: var(--pre-text); padding: 16px 20px; border-radius: var(--radius); overflow-x: auto; font-family: 'Ubuntu Mono', monospace; font-size: .92rem; margin: 12px 0; }
code { font-family: 'Ubuntu Mono', monospace; background: var(--border); padding: 2px 6px; border-radius: 3px; color: var(--purple); }
[data-theme="dark"] code { color: #E2A6DD; background: #3D3D3D; }
pre code { background: none; color: inherit; }

/* TASKS */
.task { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin: 20px 0; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.task-title { font-size: 1.05rem; font-weight: 500; margin-bottom: 10px; display: flex; gap: 10px; }
.task-title::before { content: '📝'; }
.task-desc { margin-bottom: 14px; font-size: .95rem; }
.task textarea { width: 100%; min-height: 200px; padding: 14px; border: 2px solid var(--border); border-radius: var(--radius); font-family: 'Ubuntu Mono', monospace; font-size: .92rem; background: var(--bg); color: var(--text); resize: vertical; }
.task textarea:focus { outline: none; border-color: var(--orange); }
.btn-group { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn { padding: 10px 18px; border-radius: var(--radius); font-size: .9rem; font-weight: 500; }
.btn-primary { background: var(--orange); color: #fff; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-success { background: var(--success); color: #fff; }
.result { margin-top: 14px; padding: 12px; border-radius: var(--radius); font-size: .9rem; display: none; white-space: pre-wrap; font-family: 'Ubuntu Mono', monospace; }
.result.show { display: block; }
.result.success { background: #E8F6EA; color: #0A5C16; border-left: 4px solid var(--success); }
.result.error { background: #FFE5E8; color: #8B0A19; border-left: 4px solid var(--danger); }
[data-theme="dark"] .result.success { background: rgba(14,132,32,.2); color: #7BE48B; }
[data-theme="dark"] .result.error { background: rgba(199,22,43,.2); color: #FF8A9A; }
.solution { display: none; margin-top: 14px; }
.solution.show { display: block; }

/* ADMIN */
.admin-table { width: 100%; background: var(--card-bg); border-radius: var(--radius); border-collapse: collapse; margin: 20px 0; }
.admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: .9rem; }
.admin-table th { background: var(--dark); color: #fff; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin: 20px 0; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border-left: 4px solid var(--orange); }
.saving-toast { position: fixed; top: 24px; right: 24px; background: var(--dark); color: #fff; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .3s; z-index: 1000; pointer-events: none; }
.saving-toast.show { opacity: 1; }
</style>
</head>

// API КОМПИЛЯТОРА C
// ============================================================
async function runCCode(code) {
  try {
    const response = await fetch("https://emkc.org/api/v2/piston/execute", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language: "c", version: "10.2.0", files: [{ content: code }] })
    });
    const data = await response.json();
    if (data.run && data.run.stderr) return { success: false, message: "Ошибка компиляции:\n" + data.run.stderr };
    if (!data.run || !data.run.stdout) return { success: false, message: "Нет вывода (используйте printf)" };
    return { success: true, output: data.run.stdout.trim() };
  } catch (e) {
    return { success: false, message: "Ошибка сети (API): " + e.message };
  }
}

async function checkExact(code, expected) {
  const res = await runCCode(code);
  if (!res.success) return res;
  const ok = res.output === expected.trim();
  return { success: ok, message: ok ? "Верно!" : `Ожидалось:\n${expected}\nПолучено:\n${res.output}` };
}

async function checkNum(code, expected, eps) {
  const res = await runCCode(code);
  if (!res.success) return res;
  const num = parseFloat(res.output);
  if (isNaN(num)) return { success: false, message: "Не удалось распознать число в выводе" };
  const ok = Math.abs(num - expected) < eps;
  return { success: ok, message: ok ? `Верно! ${num}` : `Ожидалось ≈${expected}, получено ${num}` };
}

async function checkLines(code, expected) {
  const res = await runCCode(code);
  if (!res.success) return res;
  const ok = res.output === expected.trim();
  return { success: ok, message: ok ? "Верно!" : `Ожидалось:\n${expected}\nПолучено:\n${res.output}` };
}

// ============================================================
// ЛОГИКА
// ============================================================
let state={currentUser:null,currentLessonId:null,completed:{},code:{},register:false,isAdmin:false,saveTimer:null,loading:false};
const $=id=>document.getElementById(id);

async function saveCloud(){
  if(!state.currentUser||state.loading) return;
  const t=$('saving-toast'); t.classList.add('show');
  try{
    await setDoc(doc(db,'users',state.currentUser.uid),{
      email:state.currentUser.email, completed:state.completed, code:state.code, updatedAt:serverTimestamp()
    },{merge:true});
  }catch(e){console.error(e);}
  clearTimeout(state.saveTimer);
  state.saveTimer=setTimeout(()=>t.classList.remove('show'),1200);
}

async function loadCloud(){
  if(!state.currentUser) return;
  state.loading=true;
  try{
    const snap=await getDoc(doc(db,'users',state.currentUser.uid));
    if(snap.exists()){ state.completed=snap.data().completed||{}; state.code=snap.data().code||{}; }
    try{
      const adminSnap=await getDoc(doc(db,'config','admins'));
      if(adminSnap.exists()){
        state.isAdmin=adminSnap.data().emails.map(e=>e.toLowerCase()).includes(state.currentUser.email.toLowerCase());
      }
    }catch(e){}
  }catch(e){console.error(e);}
  state.loading=false;
}

function updateAuthUI(){
  $('auth-title').textContent=state.register?'Регистрация':'Вход';
  $('auth-submit').textContent=state.register?'Зарегистрироваться':'Войти';
  $('toggle-text').textContent=state.register?'Уже есть аккаунт?':'Нет аккаунта?';
  $('toggle-auth').textContent=state.register?'Войти':'Зарегистрироваться';
}

function translateErr(code){
  return {'auth/invalid-email':'Некорректный email.','auth/user-not-found':'Пользователь не найден.','auth/wrong-password':'Неверный пароль.','auth/invalid-credential':'Неверный email или пароль.','auth/email-already-in-use':'Email уже зарегистрирован.','auth/weak-password':'Пароль слишком слабый (мин. 6).','auth/unauthorized-domain':'Домен не добавлен в Firebase.'}[code]||('Ошибка: '+code);
}

$('auth-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('email').value.trim(), pass=$('password').value;
  const btn=$('auth-submit'); btn.disabled=true; btn.textContent='Загрузка…';
  try{
    if(state.register) await createUserWithEmailAndPassword(auth,email,pass);
    else await signInWithEmailAndPassword(auth,email,pass);
  }catch(err){
    const el=$('auth-error'); el.textContent=translateErr(err.code); el.classList.add('show');
    btn.disabled=false; updateAuthUI();
    setTimeout(()=>el.classList.remove('show'), 5000);
  }
});
$('toggle-auth').addEventListener('click',e=>{e.preventDefault();state.register=!state.register;updateAuthUI();});

onAuthStateChanged(auth,async user=>{
  if(user){
    state.currentUser=user; $('user-email').textContent=user.email;
    await loadCloud();
    $('auth-screen').style.display='none'; $('app-screen').classList.add('show');
    renderApp();
  }else{
    state.currentUser=null; state.completed={}; state.code={}; state.isAdmin=false;
    $('auth-screen').style.display='flex'; $('app-screen').classList.remove('show');
    $('admin-link-container').innerHTML=''; updateAuthUI();
  }
});

async function logout(){ if(confirm('Выйти?')) await signOut(auth); }

function updateProgress(){
  let total=0, done=0;
  courseData.modules.forEach(m=>m.lessons.forEach(l=>{total++; if(state.completed[l.id]) done++;}));
  const p=total?Math.round(done/total*100):0;
  $('progress-percent').textContent=p+'%'; $('progress-fill').style.width=p+'%';
}

function renderNav(){
  const nav=$('nav-list'); nav.innerHTML='';
  courseData.modules.forEach(m=>{
    const t=document.createElement('div'); t.className='nav-module-title'; t.textContent=m.title; nav.appendChild(t);
    m.lessons.forEach(l=>{
      const li=document.createElement('li'); li.className='nav-item';
      const a=document.createElement('a'); a.href='#'; a.textContent=l.title;
      if(state.currentLessonId===l.id) a.classList.add('active');
      if(state.completed[l.id]) a.classList.add('completed');
      a.addEventListener('click',ev=>{ev.preventDefault();loadLesson(l.id);});
      li.appendChild(a); nav.appendChild(li);
    });
  });
  const ac=$('admin-link-container'); ac.innerHTML='';
  if(state.isAdmin){
    const b=document.createElement('a'); b.href='#'; b.className='admin-link'; b.textContent='👑 Админ-панель';
    b.addEventListener('click',ev=>{ev.preventDefault();loadAdmin();}); ac.appendChild(b);
  }
}

function loadLesson(id){
  const found=findLesson(id);
  if(!found) return;
  state.currentLessonId=id; renderNav();
  const main=$('main-content');
  let html=`<h1>${found.lesson.title}</h1><div class="theory">${found.lesson.theory}</div>`;
  found.lesson.tasks.forEach(t=>{
    const saved=state.code[t.id]!==undefined?state.code[t.id]:t.init;
    html+=`<div class="task" id="task-${t.id}">
      <div class="task-title">${t.title}</div>
      <p class="task-desc">${t.desc}</p>
      <textarea id="code-${t.id}" spellcheck="false">${esc(saved)}</textarea>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="checkTask('${t.id}')">▶ Компилировать и проверить</button>
        <button class="btn btn-secondary" onclick="toggleSol('${t.id}')">Показать решение</button>
        <button class="btn btn-success" onclick="markDone('${found.lesson.id}')">✓ Отметить пройденным</button>
      </div>
      <div class="result" id="res-${t.id}"></div>
      <div class="solution" id="sol-${t.id}"><pre><code>${esc(t.sol)}</code></pre></div>
    </div>`;
  });
  main.innerHTML=html;
  found.lesson.tasks.forEach(t=>{
    const ta=$('code-'+t.id); if(!ta) return;
    let timer;
    ta.addEventListener('input',()=>{
      state.code[t.id]=ta.value; clearTimeout(timer); timer=setTimeout(saveCloud,1500);
    });
  });
}

function findLesson(id){for(let m of courseData.modules)for(let l of m.lessons)if(l.id===id)return{module:m,lesson:l};return null;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function checkTask(id){
  const found=findLesson(state.currentLessonId);
  const t=found.lesson.tasks.find(x=>x.id===id);
  const code=$('code-'+id).value; state.code[id]=code;
  const res=$('res-'+id); res.className='result show'; res.textContent='⏳ Отправка на сервер C...';
  try{
    const r=await t.check(code);
    if(r.success){ res.className='result show success'; res.textContent='✅ '+r.message; markDone(found.lesson.id,true); }
    else { res.className='result show error'; res.textContent='❌ '+r.message; }
  }catch(e){ res.className='result show error'; res.textContent='❌ '+e.message; }
  saveCloud();
}

function toggleSol(id){$('sol-'+id).classList.toggle('show');}
function markDone(lessonId,silent){
  state.completed[lessonId]=true; updateProgress(); renderNav(); saveCloud();
}
function renderApp(){ renderNav(); updateProgress(); loadLesson(courseData.modules[0].lessons[0].id); }

// АДМИНКА
async function loadAdmin(){
  const main=$('main-content'); main.innerHTML=`<h1>👑 Админ-панель</h1><p>Загрузка…</p>`;
  try{
    const snap=await getDocs(collection(db,'users'));
    let html=`<h1>👑 Админ-панель</h1><table class="admin-table"><thead><tr><th>Email</th><th>Действия</th></tr></thead><tbody>`;
    snap.forEach(d=>{
      const u=d.data();
      const isMe=d.id===state.currentUser.uid;
      html+=`<tr><td>${esc(u.email)} ${isMe?'(вы)':''}</td><td>${!isMe?`<button class="btn btn-secondary" onclick="resetUser('${d.id}')">Сбросить</button>`:'-'}</td></tr>`;
    });
    html+='</tbody></table>'; main.innerHTML=html;
  }catch(e){ main.innerHTML=`<h1>Ошибка</h1><p>${e.message}</p>`; }
}
async function resetUser(uid){
  if(!confirm('Сбросить прогресс?')) return;
  try{ await updateDoc(doc(db,'users',uid),{completed:{},code:{}}); loadAdmin(); }catch(e){alert(e.message);}
}

window.checkTask=checkTask; window.toggleSol=toggleSol; window.markDone=markDone;
window.logout=logout; window.resetUser=resetUser;
</script>
</body>
</html>
